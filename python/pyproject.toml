[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sshi-py"
version = "0.2.0"
description = "Python 3 async client & AI agent SDK for sshx.io collaborative terminals"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Fire162" }]
keywords = ["sshx", "terminal", "ai-agent", "collaboration", "pty", "e2ee"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Terminals",
    "Topic :: System :: Networking",
]
dependencies = [
    "argon2-cffi>=23.1.0",
    "cryptography>=41.0.0",
    "cbor2>=5.5.0",
    "websockets>=12.0",
]

[project.urls]
Homepage = "https://github.com/Fire162/sshi"
Repository = "https://github.com/Fire162/sshi"

[project.scripts]
sshi-py = "sshi.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["sshi*"]
